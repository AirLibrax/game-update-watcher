# 插件配置模板：复制本文件为 config.toml 后编辑
#   cp config.example.toml config.toml   （Windows: copy config.example.toml config.toml）
# config.toml 已被 .gitignore 排除，不会提交到 Git，避免配置冲突

[plugin]
# 配置版本号（MaiBot 要求，用于配置自动迁移；实际部署时由 Runner 自动生成/维护）
config_version = "2.0.0"

enabled = true

# 要跟踪的游戏（games/*.json 的文件名列表，如 ["wuwa", "hsr"]）
# 留空 = 跟踪全部游戏；新增 games/*.json 后，把文件名加进来即可
# 设置页也会根据 games/ 目录自动列出可用选项
tracked_games = []

# 触发方式：
# 1. Tool「游戏更新速报」—— 麦麦的 LLM 在对话中判断需要时自动调用（推荐，默认）
# 2. 指令 /游戏速报 —— 群里手动触发
# 3. 定时轮询 —— 下面 scheduled_enabled=true 时启用，按间隔发到 default_groups
scheduled_enabled = false

# 定时轮询周期（分钟），仅 scheduled_enabled=true 时生效
poll_interval_minutes = 360

# 定时推送的目标 QQ 群号列表（字符串数组）
# Tool/指令触发不受此限制，发到当前对话所在群
default_groups = []

# 发布阈值：字段置信度达到该值才上卡片（0.5~1.0）
publish_threshold = 0.8

# 请求超时（秒）
http_timeout_seconds = 15

# 是否调试模式（打印更多日志，图片加水印 DEBUG）
debug = false

# P2-1 LLM 兜底抽取开关（默认关闭）：正则未抽到下版本信息且正文含日期线索时，
# 调用 Host 的 LLM 辅助抽取（需 Host 授权 llm.generate 能力；失败/超时自动静默降级）
llm_fallback_enabled = false
